<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>우편알림</title>
    <meta name="apple-mobile-web-app-title" content="우편알림" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script>
      (function() {
        var isTenant = window.location.search.indexOf('m=') !== -1 || window.location.search.indexOf('p=') !== -1;
        if (isTenant) {
          document.write('<link rel="manifest" href="/manifest.json" />');
          document.write('<link rel="apple-touch-icon" href="/favicon.png" />');
          document.write('<link rel="icon" type="image/png" href="/favicon.png" />');
        } else {
          document.write('<link rel="manifest" href="/manifest-admin.json" />');
          document.write('<link rel="apple-touch-icon" href="/favicon-admin.png" />');
          document.write('<link rel="icon" type="image/png" href="/favicon-admin.png" />');
        }
      })();
    </script>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
    <!-- PWA 설치 요건(Service Worker 즉시 등록) 충족을 위한 스크립트 -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/firebase-messaging-sw.js').then(function(registration) {
            console.log('SW registered for PWA:', registration.scope);
          }).catch(function(err) {
            console.log('SW registration failed:', err);
          });
        });
      }
    </script>
  </body>
</html>
